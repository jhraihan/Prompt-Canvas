name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promptcanvas
          POSTGRES_PASSWORD: promptcanvas
          POSTGRES_DB: promptcanvas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test settings force IMAGE_PROVIDER=stub, so CI never calls Hugging Face
      # and no real token is needed here.
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-key-not-used-for-anything-real-0123456789
      DATABASE_URL: postgres://promptcanvas:promptcanvas@localhost:5432/promptcanvas_test
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        # The coverage floor is a ratchet, not a target: it fails the build if
        # a change lands without tests. Raise it when coverage rises; never
        # lower it to make a red build pass.
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # A real browser against a real server: the only layer that proves the two
    # halves agree. Separate job so it never delays the fast feedback above.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install -r requirements.txt --quiet

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run end-to-end tests
        working-directory: frontend
        # playwright.config.js starts both servers: SQLite and the stub
        # provider, so no database service and no provider token are needed.
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real Hugging Face token is committed
        run: |
          # Template files are excluded by path: the placeholder in
          # .env.example is `hf_` + 30 x's, which matches the length bound.
          if git grep -nIE 'hf_[A-Za-z0-9]{30,}' -- . ':!*.example' ; then
            echo "::error::A Hugging Face token appears to be committed."
            exit 1
          fi
          echo "No committed Hugging Face token found."

      - name: Fail if an environment file is tracked
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env is tracked. It must stay gitignored."
            exit 1
          fi
          echo "No tracked environment file."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        # Audits the pinned production set. Dev-only tooling is excluded: a
        # vulnerability in a test runner is not a vulnerability in the shipped
        # service, and blocking a release on one trains people to ignore this.
        run: |
          python -m pip install --upgrade pip --quiet
          pip install pip-audit --quiet
          pip-audit -r backend/requirements.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        # `high` rather than `moderate`: everything here is a build-time
        # dependency that never reaches a user's browser, so a moderate
        # advisory in the toolchain should not stop a deploy.
        run: npm audit --audit-level=high

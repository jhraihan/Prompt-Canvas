name: Feature request
description: Suggest a capability the project does not have
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [`docs/PRD.md`](../blob/main/docs/PRD.md) first — the roadmap may
        already cover this, in which case comment there instead.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you unable to do today? Describe the situation, not the
        feature — the best solution may not be the one you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including doing nothing, or solving it outside the app.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Generation and prompting
        - History and gallery
        - Accounts and authentication
        - Design, theming, or accessibility
        - Deployment and operations
        - Developer experience
        - Other
    validations:
      required: true

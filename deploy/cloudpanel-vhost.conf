# Prompt Canvas - nginx location blocks for CloudPanel.
#
# This file is a TEMPLATE. It carries no host-specific values so that the
# repository stays portable. bootstrap.sh renders it to
# ${SITE_HOME}/cloudpanel-vhost.rendered.conf with the __PLACEHOLDER__ values
# substituted; paste THAT file's contents, not this one.
#
# To render it by hand:
#   sed -e "s|__API_DOMAIN__|api.example.com|g" \
#       -e "s|__APP_ORIGIN__|https://app.example.com|g" \
#       -e "s|__SITE_USER__|prompt-canvas|g" \
#       -e "s|__PORT__|8021|g" \
#       deploy/cloudpanel-vhost.conf
#
# CloudPanel owns the vhost, so this is NOT a standalone site file. Paste the
# two rendered blocks into:
#
#   CloudPanel -> Sites -> <your API domain> -> Vhost
#
# They must go ABOVE the existing "location /" block that CloudPanel generated
# (nginx picks the longest matching prefix, but keeping them first also keeps
# the file readable). Leave everything else CloudPanel wrote alone -- it owns
# the TLS block, the listen directives, and the reverse proxy to 127.0.0.1:__PORT__.

# --- Generated images ------------------------------------------------------
# Served straight off disk rather than through gunicorn. Each file is addressed
# by a random 32-hex key, so the URL is the capability; directory listing stays
# off so the keys cannot be enumerated.
location /media/ {
    alias /home/__SITE_USER__/htdocs/__API_DOMAIN__/backend/media/;
    autoindex off;

    # Cache-Control is set explicitly rather than via `expires`, which would
    # emit a second, weaker Cache-Control header alongside this one.
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;

    # The Vercel frontend fetches these into a blob so the download can carry a
    # meaningful filename. Without this header the browser navigates to the
    # image instead of saving it.
    add_header Access-Control-Allow-Origin "__APP_ORIGIN__" always;
    add_header Vary "Origin" always;

    # Nothing under /media/ is ever executable.
    location ~* \.(php|py|sh|cgi|pl)$ {
        return 404;
    }
}

# --- Django admin static files --------------------------------------------
location /static/ {
    alias /home/__SITE_USER__/htdocs/__API_DOMAIN__/backend/staticfiles/;
    autoindex off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# --- Generation rate limit (optional) --------------------------------------
# Image generation is slow and costs money upstream, so it is capped at the
# edge as well as inside Django. To use this, first add the zone to the http{}
# block in /etc/nginx/nginx.conf:
#
#   limit_req_zone $binary_remote_addr zone=promptcanvas_generate:10m rate=30r/m;
#
# then uncomment the block below. Without the zone directive nginx will refuse
# to start, so do not enable one without the other.
#
# location /api/images/generate/ {
#     limit_req zone=promptcanvas_generate burst=5 nodelay;
#     proxy_pass http://127.0.0.1:__PORT__;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Real-IP         $remote_addr;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_read_timeout 180s;
#     proxy_send_timeout 180s;
# }

# --- Note on timeouts ------------------------------------------------------
# A cold FLUX model can take well over a minute. CloudPanel's default
# proxy_read_timeout is 60s, which would return 504 before the image is ready.
# In the same Vhost editor, raise it on the main "location /" block:
#
#   proxy_read_timeout 180s;
#   proxy_send_timeout 180s;
